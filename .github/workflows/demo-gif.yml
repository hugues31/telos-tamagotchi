name: Demo GIF

# Re-records docs/demo.gif (embedded by the telos-sdd README) whenever the
# sealed spec or the recording script changes. The MP4 is only a run artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telos/**"
      - "tools/record_demo.py"
      - "tools/test_record_demo.py"
      - ".github/workflows/demo-gif.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install Telos v0.8.2
        run: |
          version=0.8.2
          asset="telos_${version}_linux_amd64.tar.gz"
          base="https://github.com/hugues31/telos-sdd/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "${asset}"
          install -D -m 0755 telos "$HOME/.local/bin/telos"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Smoke-test the tour
        run: python3 -m unittest tools.test_record_demo
      - name: Record the demo
        run: python3 tools/record_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: docs/demo.mp4
      - name: Commit the refreshed GIF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git diff --cached --quiet || git commit -m "docs: refresh demo GIF [skip ci]"
          git push
